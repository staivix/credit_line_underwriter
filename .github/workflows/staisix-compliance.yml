name: STAISIX Continuous AI Compliance Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  staisix-compliance-scan:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps:
      - name: Checkout Codebase Repository
        uses: actions/checkout@v5

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 📦 Local Project Ingestion: Install the engine directly inside the working runner directory
      - name: Install STAISIX Enterprise CLI Tool
        run: npm install "https://${{ secrets.STAISIX_GITHUB_TOKEN }}@://github.com"

      # 🚀 Absolute Execution Path: Calls the live script directly out of your local project node module dependencies
      - name: Run Live Compliance Verification Engine
        env:
          AIRTABLE_PAT: ${{ secrets.STAISIX_AIRTABLE_PAT }}
        run: npx staisix scan
